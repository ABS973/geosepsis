<!doctype html><html><meta charset="utf-8"><title>UI checks</title><body><pre id="results">Running</pre><iframe id="frame" src="../index.html" style="width:1366px;height:900px"></iframe><script>
frame.onload=async()=>{const w=frame.contentWindow,d=w.document;const results=[],errors=[];w.addEventListener('error',e=>errors.push(e.message));let failed=0;const check=(name,fn)=>{try{if(fn()===false)throw Error('assertion failed');results.push('PASS '+name);}catch(e){failed++;results.push('FAIL '+name+': '+e.message);}};const run=s=>w.eval(s),click=a=>{const b=[...d.querySelectorAll('[data-action]')].find(b=>b.dataset.action===a);if(!b)throw Error('Missing '+a);b.click();};
check('Overview renders eight physiological signals',()=>d.querySelectorAll('.vital').length===8);
check('Ready state hides physiological measurements',()=>{if(!d.body.textContent.includes('SYSTEM READY'))throw Error('No ready message');if(![...d.querySelectorAll('.vital p')].every(x=>x.textContent.includes('Waiting')))throw Error('Vitals visible before start');return true;});
check('Start creates simulation ID and pause works',()=>{click('start');if(!run('running && /^GS-\\d{4}$/.test(engine.id)'))throw Error('Start failed');click('start');return !run('running');});
check('Six routes render without removed pages',()=>{for(const p of ['Overview','Geometry','Research','System Architecture','Impact','About']){click('nav:'+p);if(!d.querySelector('.content').textContent.trim())throw Error('Empty '+p);}if(d.body.textContent.includes('Live Monitor')||d.body.textContent.includes('Matrix Analysis'))throw Error('Removed page still visible');return true;});
check('Overview compact matrix controls render real numerical properties',()=>{click('nav:Overview');click('matrix-tab:Matrix');click('matrix-state:Difference');if(d.querySelectorAll('.content .heatmap [role=cell]').length!==64)throw Error('Missing matrix cells');click('matrix-tab:Geometry');return d.body.textContent.includes('Condition number')&&d.body.textContent.includes('Current dR');});
check('Warning derives from simulated observations and opens explanation',()=>{run('for(let i=0;i<100;i++)engine.step();render()');click('nav:Overview');if(!d.querySelector('.warning'))throw Error('No warning');click('explain:warning');if(!d.querySelector('#drawer').open)throw Error('No drawer');click('close');return true;});
check('Capture and baseline comparison render real matrices',()=>{click('capture');if(d.querySelectorAll('#drawer .heatmap').length!==2)throw Error('Missing matrices');click('close');click('baseline');click('close');return true;});
check('Compare states, zoom, rotation and timeline work',()=>{click('compare');click('rotate');click('zoom-in');click('zoom-out');click('view-reset');click('state:now');return d.querySelectorAll('.content .compare-radars .radar').length===2;});
check('Reset clears ID, warning, snapshot and history',()=>{click('reset');return run('engine.t===0 && engine.id===null && !engine.warning && snapshot===null && engine.history.length===0 && !running');});
check('Twenty reset/start cycles remain usable',()=>{for(let i=0;i<20;i++){click('start');run('engine.step()');click('reset');}return run('!running && engine.t===0');});
check('Scenario selector changes engine behavior and IDs',()=>{click('scenario:healthy');click('start');const id1=run('engine.id'),start1=run('engine.vitals.slice(0,6).map(x=>x.toFixed(1)).join(",")');run('for(let i=0;i<45;i++)engine.step();render()');if(run('engine.warning'))throw Error('Healthy warning');click('reset');click('scenario:rapid');click('start');const id2=run('engine.id'),start2=run('engine.vitals.slice(0,6).map(x=>x.toFixed(1)).join(",")');run('for(let i=0;i<45;i++)engine.step();render()');if(run('engine.d')<2)throw Error('Rapid scenario did not diverge');return id1!==id2&&start1!==start2;});
check('Manifold supports 3D pointer orbit and wheel zoom',()=>{click('nav:Overview');const wrap=d.querySelector('.manifold-wrap'),before=run('[yaw,pitch,cameraDistance].join(",")');wrap.dispatchEvent(new PointerEvent('pointerdown',{clientX:10,clientY:10,bubbles:true,pointerId:1}));d.dispatchEvent(new PointerEvent('pointermove',{clientX:90,clientY:85,bubbles:true,pointerId:1}));d.dispatchEvent(new PointerEvent('pointerup',{bubbles:true,pointerId:1}));wrap.dispatchEvent(new WheelEvent('wheel',{deltaY:-120,bubbles:true,cancelable:true}));return run('[yaw,pitch,cameraDistance].join(",")')!==before;});
check('Speed selector changes simulation cadence',()=>{click('reset');click('speed:5');click('start');return run('speed===5 && running');});
check('Desktop has no horizontal overflow',()=>d.documentElement.scrollWidth<=1366);
frame.style.width='390px';await new Promise(r=>setTimeout(r,100));check('Mobile routes have no horizontal overflow',()=>{for(const p of ['Overview','Geometry','Research','System Architecture','Impact','About']){click('nav:'+p);if(d.documentElement.scrollWidth>d.documentElement.clientWidth)throw Error(p+' overflows: '+d.documentElement.scrollWidth+' / '+d.documentElement.clientWidth);}return true;});click('nav:Overview');click('reset');click('start');await new Promise(r=>setTimeout(r,1250));click('start');check('Live timer advances and pause freezes simulation',()=>run('engine.t>=1 && !running'));const pausedAt=run('engine.t');await new Promise(r=>setTimeout(r,1200));check('Paused observation time stays unchanged',()=>run('engine.t')===pausedAt);check('No browser JavaScript errors',()=>errors.length===0);document.getElementById('results').textContent=JSON.stringify({failed,results},null,2);document.title=failed?'FAIL':'PASS';};
</script></body></html>
