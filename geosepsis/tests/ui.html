<!doctype html><html><meta charset="utf-8"><title>UI checks</title><body><pre id="results">Running</pre><iframe id="frame" src="../index.html" style="width:1366px;height:900px"></iframe><script>
frame.onload=async()=>{const w=frame.contentWindow,d=w.document;const results=[],errors=[];w.addEventListener('error',e=>errors.push(e.message));let failed=0;const check=(name,fn)=>{try{if(fn()===false)throw Error('assertion failed');results.push('PASS '+name);}catch(e){failed++;results.push('FAIL '+name+': '+e.message);}};const run=s=>w.eval(s),click=a=>{const b=[...d.querySelectorAll('[data-action]')].find(b=>b.dataset.action===a);if(!b)throw Error('Missing '+a);b.click();};
check('Overview renders eight physiological signals',()=>d.querySelectorAll('.vital').length===8);
check('Start creates simulation ID and pause works',()=>{click('start');if(!run('running && /^GS-\\d{4}$/.test(engine.id)'))throw Error('Start failed');click('start');return !run('running');});
check('All eight routes render without errors',()=>{for(const p of ['Overview','Live Monitor','Geometry','Matrix Analysis','Research','System Architecture','Impact','About']){click('nav:'+p);if(!d.querySelector('.content').textContent.trim())throw Error('Empty '+p);}return true;});
check('Matrix controls and numerical properties render',()=>{click('nav:Matrix Analysis');for(const t of ['Correlation','Eigenvalues','Properties','Covariance'])click('matrix-tab:'+t);click('matrix-state:Difference');return d.querySelectorAll('.heatmap [role=cell]').length===64;});
check('Warning derives from simulated observations and opens explanation',()=>{run('for(let i=0;i<100;i++)engine.step();render()');click('nav:Overview');if(!d.querySelector('.warning'))throw Error('No warning');click('explain:warning');if(!d.querySelector('#drawer').open)throw Error('No drawer');click('close');return true;});
check('Capture and baseline comparison render real matrices',()=>{click('capture');if(d.querySelectorAll('#drawer .heatmap').length!==2)throw Error('Missing matrices');click('close');click('baseline');click('close');return true;});
check('Compare states, zoom, rotation and timeline work',()=>{click('compare');click('rotate');click('zoom-in');click('zoom-out');click('view-reset');click('state:now');return d.querySelectorAll('.content .compare-radars .radar').length===2;});
check('Reset clears ID, warning, snapshot and history',()=>{click('reset');return run('engine.t===0 && engine.id===null && !engine.warning && snapshot===null && engine.history.length===0 && !running');});
check('Twenty reset/start cycles remain usable',()=>{for(let i=0;i<20;i++){click('start');run('engine.step()');click('reset');}return run('!running && engine.t===0');});
check('Desktop has no horizontal overflow',()=>d.documentElement.scrollWidth<=1366);
frame.style.width='390px';await new Promise(r=>setTimeout(r,100));check('Mobile routes have no horizontal overflow',()=>{for(const p of ['Overview','Live Monitor','Geometry','Matrix Analysis','Research','System Architecture','Impact','About']){click('nav:'+p);if(d.documentElement.scrollWidth>d.documentElement.clientWidth)throw Error(p+' overflows: '+d.documentElement.scrollWidth+' / '+d.documentElement.clientWidth);}return true;});click('nav:Overview');click('reset');click('start');await new Promise(r=>setTimeout(r,1250));click('start');check('Live timer advances and pause freezes simulation',()=>run('engine.t>=1 && !running'));const pausedAt=run('engine.t');await new Promise(r=>setTimeout(r,1200));check('Paused observation time stays unchanged',()=>run('engine.t')===pausedAt);check('No browser JavaScript errors',()=>errors.length===0);document.getElementById('results').textContent=JSON.stringify({failed,results},null,2);document.title=failed?'FAIL':'PASS';};
</script></body></html>
